<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="출석부 — 학생 출결을 쉽고 빠르게 관리하세요">
  <meta name="theme-color" content="#D97757">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="출석부">

  <title>출석부 — 출결 관리</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans + Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">

  <!-- Pretendard font (Korean fallback) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    onload="this.onload=null;this.rel='stylesheet'">

  <!-- Flatpickr (calendar) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>
<body>

  <!-- ======== AUTH LOADING OVERLAY ======== -->
  <div id="app-loading" style="position:fixed;inset:0;z-index:9999;background:var(--color-bg,#fff);display:flex;align-items:center;justify-content:center;">
    <div style="width:36px;height:36px;border:3px solid var(--color-border,#e5e7eb);border-top-color:var(--color-primary,#4F46E5);border-radius:50%;animation:spin .7s linear infinite;"></div>
  </div>
  <style>#app-loading{transition:opacity .15s} @keyframes spin{to{transform:rotate(360deg)}}</style>

  <!-- ======== APP SHELL ======== -->
  <div class="app-container">

    <!-- SIDEBAR (PC) -->
    <aside class="sidebar" role="navigation" style="display:none;"></aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">

      <!-- Page content outlet -->
      <main id="app-content" role="main" tabindex="-1" style="outline:none;"></main>

    </div>

    <!-- BOTTOM NAV (mobile) -->
    <nav class="bottom-nav" style="display:none;"></nav>

  </div>

  <!-- ======== MODAL ======== -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title-text" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title-text"></h2>
        <button class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-cancel"></button>
        <button class="btn btn-primary modal-confirm"></button>
      </div>
    </div>
  </div>

  <!-- ======== TOAST CONTAINER ======== -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- ======== SCRIPTS ======== -->

  <!-- Flatpickr + Korean locale -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

  <!-- Chart.js (deferred) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>

  <!-- jsPDF + autoTable (deferred, premium only) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>

  <!-- Firebase importmap (로컬 번들 사용 — CDN 의존성 제거로 첫 실행 로딩 문제 방지) -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app":       "/js/firebase-sdk/firebase-app.js",
      "firebase/auth":      "/js/firebase-sdk/firebase-auth.js",
      "firebase/firestore": "/js/firebase-sdk/firebase-firestore.js",
      "firebase/analytics": "/js/firebase-sdk/firebase-analytics.js",
      "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js":       "/js/firebase-sdk/firebase-app.js",
      "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js":      "/js/firebase-sdk/firebase-auth.js",
      "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js": "/js/firebase-sdk/firebase-firestore.js",
      "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js": "/js/firebase-sdk/firebase-analytics.js"
    }
  }
  </script>

  <!-- App entry point (ES module) -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
